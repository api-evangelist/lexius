aid: lexius
name: Lexius
description: Lexius is a Y Combinator-backed AI loss-prevention platform that turns
  a retailer's existing security cameras into proactive, revenue-protecting systems.
  It detects shoplifting in real time (concealment, product sweeping, known-offender
  entry), sends instant mobile alerts with video clips, and offers traceback search
  — natural-language search across every connected camera feed. Lexius also builds
  case files for law enforcement, flags known offenders chain-wide, and detects
  slip-and-fall events for liability protection. It connects to existing NVR/VMS
  systems from any brand, including Hikvision, Axis, Dahua, Hanwha, Bosch, Honeywell,
  Uniview, Lorex, LTS, Avigilon, and Genetec, and is typically deployed remotely in
  under 24 hours without replacing hardware. Lexius publishes no public developer
  API, SDK, or documentation surface as of this profile; it is delivered as a hosted
  dashboard plus camera/NVR integrations.
